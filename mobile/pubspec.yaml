name: finan_as
description: Aplicativo para transcrição e análise de áudio.
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  file_picker: ^8.0.3
  record: ^5.1.2
  permission_handler: ^11.3.1
  intl: ^0.19.0
  flutter_secure_storage: ^9.2.2
  share_plus: ^10.0.3
  pdf: ^3.11.0
  printing: ^5.13.4
  flutter_dotenv: ^5.1.0
  path_provider: ^2.1.4

flutter:
  uses-material-design: true
  assets:
    - .env
